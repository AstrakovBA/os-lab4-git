name: CI and Docker Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run unit test
        run: |
          echo "Все тесты прошли успешно!"

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t my-app:${{ github.sha }} .

      - name: Test Docker Container
        run: |
          docker run -d -p 8080:8080 --name test_app my-app:${{ github.sha }}
          sleep 2
          curl --fail http://localhost:8080 || exit 1

  ansible-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Ansible Lint
        uses: ansible/ansible-lint@main
        with:
          # Передаем путь к файлу через args, так как параметра path нет
          args: "ansible_iac/setup_env.yml"

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose file
        run: |
          cd monitoring
          docker compose config
