name: Bash Script CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Run unit test
        run: |
          chmod +x app_calculator.sh
          output=$(./app_calculator.sh 5 10)
          if [ "$output" != "Сумма: 15" ]; then
            echo "Тест провален: $output"
            exit 1
          fi
          echo "Тест успешно пройден!"
